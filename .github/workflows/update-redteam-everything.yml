name: Daily Red Team Everything Update + ULTIMATE MAX Discovery

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Update all core submodules
        run: git submodule update --init --recursive --remote --jobs 4

      - name: Fetch all official feeds
        run: |
          mkdir -p feeds/cve/nvd feeds/cisa feeds/mitre
          cd feeds/cve/nvd && wget -q https://nvd.nist.gov/feeds/json/cve/1.1/nvdcve-1.1-recent.json.gz -O recent.json.gz && gunzip -f *.gz || true
          cd ../../cisa && wget -q https://www.cisa.gov/known-exploited-vulnerabilities.json -O kev.json || true
          cd ../../mitre && wget -q https://raw.githubusercontent.com/mitre/cti/master/enterprise-attack/enterprise-attack.json -O enterprise-attack.json || true

      - name: ULTIMATE MAX Discovery - Get literally everything possible
        run: |
          mkdir -p discovered-pocs
          echo "🚀 ULTIMATE MAX DISCOVERY STARTED - pulling everything GitHub has..."

          for query in \
            "CVE PoC" "exploit PoC" "0day PoC" "0-day PoC" "RCE PoC" \
            "LPE PoC" "privilege escalation PoC" "payload PoC" "bypass PoC" \
            "remote code execution PoC" "local privilege escalation PoC" \
            "exploit" "PoC" "proof of concept exploit"; do
            echo "Searching: $query"
            gh search repos "$query" --limit 1000 --json url --jq '.[].url' | while read repo; do
              name=$(basename "$repo" .git 2>/dev/null || basename "$repo")
              if [ ! -d "discovered-pocs/$name" ]; then
                echo "→ Cloning new repo: $repo"
                git clone --depth 1 "$repo" "discovered-pocs/$name" || true
              fi
            done
          done

      - name: Generate full append-only history
        run: |
          chmod +x scripts/generate-history.sh
          scripts/generate-history.sh

      - name: Commit & push (append-only - we keep EVERYTHING)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ULTIMATE MAX daily update - everything that exists on GitHub"
          file_pattern: .
