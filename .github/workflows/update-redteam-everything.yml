name: Daily Red Team Everything Update + ULTIMATE Self-Learning (Real Code)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Fetch official feeds
        run: |
          mkdir -p feeds/cve/nvd feeds/cisa feeds/mitre
          wget -q https://nvd.nist.gov/feeds/json/cve/1.1/nvdcve-1.1-recent.json.gz -O feeds/cve/nvd/recent.json.gz && gunzip -f feeds/cve/nvd/recent.json.gz || true
          wget -q https://www.cisa.gov/known-exploited-vulnerabilities.json -O feeds/cisa/kev.json || true
          wget -q https://raw.githubusercontent.com/mitre/cti/master/enterprise-attack/enterprise-attack.json -O feeds/mitre/enterprise-attack.json || true

      - name: SELF-LEARNING - Extract patterns from everything we have
        run: |
          mkdir -p patterns
          find exploits cves payloads discovered-pocs/exploits -type f 2>/dev/null | sed 's/.*\.//' | sort | uniq -c | sort -rn | head -30 > patterns/common_extensions.txt
          grep -r -i -E 'exploit|proof of concept|remote code execution|local privilege escalation|shellcode|bypass|payload' \
            exploits/*/README.md cves/*/README.md discovered-pocs/exploits/*/README.md 2>/dev/null | \
            sed 's/.*://' | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '\n' | sort | uniq -c | sort -rn | head -100 > patterns/exploit_phrases.txt

      - name: ULTIMATE Discovery + Classification (rate limited)
        run: |
          mkdir -p discovered-pocs/{exploits,tools,writeups,cves,other}
          QUERIES=("CVE PoC" "exploit PoC" "0day PoC" "0-day PoC" "RCE PoC" "LPE PoC" "privilege escalation PoC" "payload PoC" "bypass PoC" "remote code execution" "local privilege escalation" "shellcode" "PoC" "proof of concept" "exploit code" "vulnerability PoC" "red team tool" "pentest tool" "CTF exploit" "writeup exploit" "exploit" "PoC" "proof of concept exploit")
          for query in "${QUERIES[@]}"; do
            echo "Searching: $query"
            gh search repos "$query" --limit 1000 --json url --jq '.[].url' | while read repo; do
              name=$(basename "$repo" .git 2>/dev/null || basename "$repo")
              if [ -d "discovered-pocs/exploits/$name" ] || [ -d "discovered-pocs/tools/$name" ] || [ -d "discovered-pocs/writeups/$name" ] || [ -d "discovered-pocs/cves/$name" ] || [ -d "discovered-pocs/other/$name" ]; then continue; fi
              echo "→ Cloning: $repo"
              git clone --depth 1 "$repo" "discovered-pocs/temp/$name" || true
              cd "discovered-pocs/temp/$name" 2>/dev/null || continue
              SCORE=0
              if grep -q "$(basename "$name" | tr '[:upper:]' '[:lower:]')" ../../patterns/exploit_phrases.txt 2>/dev/null; then SCORE=$((SCORE+3)); fi
              if ls | grep -qE '\.(py|sh|bin|exe|js|ps1)$' 2>/dev/null; then SCORE=$((SCORE+2)); fi
              if grep -iqE 'exploit|cve-|rce|lpe|privilege|payload|bypass|shellcode|proof of concept' README.md * 2>/dev/null; then SCORE=$((SCORE+4)); fi
              if [[ "$name" =~ (exploit|cve|PoC|RCE|LPE|shellcode|bypass) ]]; then SCORE=$((SCORE+3)); fi
              if [ $SCORE -ge 5 ]; then mv "../temp/$name" "../exploits/" 2>/dev/null || true
              elif [ $SCORE -ge 3 ]; then mv "../temp/$name" "../tools/" 2>/dev/null || true
              elif [ $SCORE -ge 1 ]; then mv "../temp/$name" "../writeups/" 2>/dev/null || true
              else mv "../temp/$name" "../other/" 2>/dev/null || true; fi
              cd - > /dev/null
            done
            sleep 10
          done
          rm -rf discovered-pocs/temp 2>/dev/null || true

      - name: Generate full append-only history
        run: chmod +x scripts/generate-history.sh && scripts/generate-history.sh

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ULTIMATE self-learning update - real code + patterns from everything + full history"
          file_pattern: .
